name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Set release version
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); const [major, minor, patch] = p.version.split(".").map(Number); p.version = `${major}.${minor}.${patch + Number(process.env.GITHUB_RUN_NUMBER)}`; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n");'
      - name: Publish to npm
        run: bun publish --access public --tolerate-republish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
